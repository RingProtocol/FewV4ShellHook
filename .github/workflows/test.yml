name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: default

jobs:
  build-and-test:
    name: Build and hermetic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check

      - name: Build and check bytecode size
        run: forge build --sizes

      - name: Run hermetic tests
        run: forge test --no-match-path "test/fork/*" -vvv

      - name: Check high-severity lint findings
        run: forge lint --severity high

  fork-tests:
    name: Fixed-block mainnet fork tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run fork tests
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: forge test --match-path "test/fork/*" -vvv

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: "."
          # Keep informational findings visible without blocking unrelated dependency warnings.
          fail-on: none
          slither-args: >-
            --filter-paths "lib/|test/|script/"
            --exclude naming-convention,solc-version,pragma
